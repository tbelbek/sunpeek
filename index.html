  .chk { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 8px; cursor: pointer; } .chk input { width: 20px; height: 20px; accent-color: var(--blue); }
  table.net td { vertical-align: top; } table.net .bad { color: var(--bad); font-size: 13px; } table.net td:last-child { white-space: nowrap; padding-left: 8px; }
  .wins { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 10px; font-size: 14px; } .wins span:nth-child(odd) { color: var(--muted); }
  .facrow { display: flex; align-items: center; gap: 10px; margin: 4px 0 6px; padding: 8px 0 8px 12px; border-radius: 12px; background: var(--soft); }
  .facrow > div { flex: 1; min-width: 0; } .facrow > .ic { color: #06b6d4; }
  .field { display: flex; align-items: center; gap: 8px; min-height: 52px; border-bottom: 1px solid var(--line); }
  .field > label { flex: 1; min-width: 0; color: var(--muted); }
  .field input[type=date] { height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  /* kat: en önemli girdi — sonucun üstünde, büyük ve vurgulu */
  .floorbox { margin: 4px 0 8px; padding: 6px 6px 6px 12px; border: 2px solid var(--accent); border-radius: 14px; background: var(--accent-soft); min-height: 64px; }
  .floorbox > label { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 8px; color: var(--fg); font-weight: 700; font-size: 16px; } .floorbox > label .ic { color: var(--accent); }
  .floorbox #eyeM { grid-column: 2; font-weight: 400; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .floorbox .stepper { background: var(--card); } .floorbox .stepper .iconbtn { width: 48px; height: 48px; } .floorbox #kat { width: 48px; height: 48px; font-size: 22px; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stepper .iconbtn { width: 44px; height: 44px; border-radius: 0; }
  #kat { width: 40px; height: 44px; border: 0; background: transparent; text-align: center; font-weight: 700; -moz-appearance: textfield; }
  #kat::-webkit-inner-spin-button, #kat::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #time { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  #now { display: flex; align-items: center; gap: 8px; min-height: 36px; }
  #clearK { margin-top: 8px; }
  #gstat:empty, #pos:empty, #rel:empty { display: none; }
  #gstat { margin-top: 8px; font-size: 14px; } #gstat.say { flex-wrap: wrap; } #gstat .btn { height: 36px; margin-top: 6px; }
  #look { width: 100%; margin-top: 8px; } #look[hidden] { display: none; }
  #sky { display: block; width: 180px; height: 180px; margin: 12px auto 0; }
  #rel { text-align: center; font-weight: 600; margin-top: 4px; }
  details.sec { border-top: 1px solid var(--line); margin-top: 12px; }
  details.sec > summary { display: flex; align-items: center; justify-content: space-between; min-height: 48px; list-style: none; cursor: pointer; font-weight: 600; }
  details.sec > summary .ic { color: var(--muted); transition: transform .2s; } details.sec[open] > summary .ic { transform: rotate(180deg); }
  #lang, #clock { height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; } td { padding: 6px 0; border-top: 1px solid var(--line); } td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .leg { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .hrow { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); } .hgo { flex: 1; min-width: 0; padding: 4px 0; border: 0; background: none; text-align: left; }
  .lbl { color: #fff; font: 600 13px system-ui, sans-serif; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  /* Kart (tanıtım, yardım, uyarı) */
  #modal { width: min(440px, calc(100vw - 32px)); max-height: 90vh; padding: 0; border: 0; border-radius: 18px; background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
  #modal::backdrop { background: rgb(0 0 0 / .5); }
  #card { padding: 20px; line-height: 1.5; }
  #card h2 { margin: 0 0 8px; font-size: 20px; } #card h3 { margin: 16px 0 6px; font-size: 15px; } #card p { margin: 6px 0; }
  #card .perm { display: flex; gap: 10px; align-items: flex-start; } #card .perm .ic { color: var(--blue); margin-top: 2px; }
  #card .actions { display: flex; gap: 8px; margin-top: 18px; } #card .actions .btn { flex: 1; }
  #card a { color: var(--link); }
  .leaflet-control-attribution { background: var(--card) !important; color: var(--muted) !important; }
  @media (max-width: 700px) { .leaflet-control-attribution { font-size: 9px; line-height: 1.25; } } /* uzun Esri kaynak satırı haritayı kapatmasın; görünür kalmalı */ .leaflet-control-attribution a { color: var(--blue) !important; }
  .leaflet-bar a { background: var(--card) !important; color: var(--fg) !important; border-color: var(--line) !important; }
  @media (max-width: 700px) {
    html, body { font-size: 15px; } #sum { font-size: 16px; }
    #map { bottom: 44%; } body.closed #map { bottom: 64px; }
    #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 44%; max-height: none; border-radius: 18px 18px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    body.closed #panel { height: auto; } /* tam açık: harita şeridi kalmaz; arama ve harita düğmeleri gizlenir, mevsim çubuğu üstte kalır (52 px + 8 boşluk + 8 aralık) */
    body.expanded #panel { height: calc(100% - 68px - env(safe-area-inset-top)); } body.expanded #sform, body.expanded #sresults, body.expanded #conf, body.expanded #key, body.expanded #fabs, body.expanded #backbtn { display: none; }
    #sheet[open] > summary .chev { display: none; } /* açıkken tek düğme: büyüt/küçült */ body.closed #expandbtn { display: none; }
    #fabs { bottom: calc(44% + 44px); } body.closed #fabs { bottom: 76px; } /* atıf satırının (2–3 satır) üstünde: Esri atfı engellenmemeli */
    #backbtn { bottom: calc(44% + 12px); } body.closed #backbtn { bottom: 76px; }
    .leaflet-control-zoom { display: none; }
    #sheet > summary { touch-action: none; } /* başlık sürüklenir; tarayıcı kaydırmaya çevirmesin */
    #sky { width: 160px; height: 160px; }
    /* telefonda yalnız seçili mevsim yazıyla, diğerleri simge (etiket aria-label'da). Tüm adlar yazılınca çubuk
       ~420-520 px oluyor ve oynat/küçült düğmeleri ekran dışına itiliyordu: sığması etiketten önemli. */
    #seasons button[data-s]:not(.on) span { display: none; } #seasons button[data-s]:not(.on) { width: 44px; padding: 0; justify-content: center; } #seasons button { padding: 0 8px; font-size: 13px; } #seasons { gap: 0; }
  }
  @media (min-width: 701px) { body.closed #panel { top: auto; bottom: 24px; } /* kapalı panel masaüstünde sol alta yaslanır */
    /* masaüstü: arama solda, mevsimler hemen yanında (tam genişlik, tüm etiketler); sonuçlar ve uyarı aramanın altında */
    #top { right: 8px; display: grid; grid-template-columns: 360px auto; justify-content: start; align-items: start; }
    #sform { grid-column: 1; grid-row: 1; } #seasons { grid-column: 2; grid-row: 1; max-width: calc(100vw - 422px); width: max-content; } /* sağ üstteki zoom düğmelerine girmesin */
    #sresults { grid-column: 1; grid-row: 2; } #conf { position: absolute; top: 2px; right: 52px; } /* masaüstü: sağ üstte, zoom düğmelerinin solunda */
    #panel { top: 120px; max-height: calc(100% - 160px); } #fabs { bottom: 44px; } } /* atıf satırı dar ekranda 2 satır: örtülmesin */
  /* tablet (701–1100 px): mevsim çubuğu sığsın, seçili olmayan mevsimler yalnız simge (etiket aria-label'da) */
  @media (min-width: 701px) and (max-width: 1100px) { #seasons button[data-s]:not(.on) span { display: none; } #seasons button[data-s]:not(.on) { width: 44px; padding: 0; justify-content: center; } }
  /* Hareket: tek eğri, kısa süreler; yalnız opaklık/dönüşüm (panel yüksekliği hariç). Kapanışlar anında, açılışlar yumuşak. */
  :root { --ease: cubic-bezier(.2, .7, .2, 1); interpolate-size: allow-keywords; } /* destekleyen tarayıcıda kapalı panelin 'auto' yüksekliğine de kayar */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .iconbtn, .btn, .fab, .chip, #seasons button, #sresults button { transition: transform 120ms var(--ease), background-color 160ms var(--ease), color 160ms var(--ease); }
  .iconbtn:active, .btn:active, .fab:active, .chip:active, #seasons button:active, #sresults button:active { transform: scale(.97); }
  #backbtn:active { transform: translateX(-50%) scale(.97); }
  #sheet > summary .chev, #expandbtn svg, details.sec > summary > .ic { transition: transform 200ms var(--ease); }
  #modal[open] { animation: rise 220ms var(--ease); } #modal[open]::backdrop { animation: fadein 220ms var(--ease); }
  #consent:not([hidden]) { animation: consentin 240ms var(--ease); } @keyframes consentin { from { opacity: 0; transform: translate(-50%, 8px); } } /* ortalama dönüşümü korunur */
  #tip:not([hidden]) { animation: fadein 120ms var(--ease); }
  #sresults:not(:empty), #key:not([hidden]), #conf { animation: fadein 200ms var(--ease); }
  details.sec[open] > summary ~ * { animation: fadein 200ms var(--ease); }
  @media (max-width: 700px) { #panel { transition: height 240ms var(--ease); } } /* sürükleyip bırakınca yerine kayar; sürüklerken JS kapatır */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; } #modal, #modal::backdrop, #consent, #tip, #sresults, #key, #conf, details.sec * { animation: none !important; } }
