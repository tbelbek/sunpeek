  <div id="clearK" hidden></div>
  <div id="house" style="display:none"></div>

  <div id="now"></div>
  <button id="look" class="btn" hidden><svg class="ic" aria-hidden="true"><use href="#i-locate"/></svg><span data-t="look"></span></button>
  <div id="gstat"></div>
  <div id="rel"></div>

    <svg id="sky" viewBox="-115 -115 230 230"></svg>
    <div id="pos" class="muted" style="text-align:center;margin-top:4px"></div></details>
  <details id="histbox" class="sec"><summary><span><span data-t="history"></span> (<span id="hcount">0</span>)</span><svg class="ic" aria-hidden="true"><use href="#i-chevron-down"/></svg></summary><div id="hist"></div></details>

    <div class="field"><label for="lang"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg></label><select id="lang" aria-label="Language"></select></div>
    <div class="field"><label for="clock" data-t="clockLabel"></label><select id="clock"></select></div>
    <table>
      <tr><td data-t="riseSet"></td><td id="riseset"></td></tr>
      <tr><td data-t="noon"></td><td id="noon"></td></tr>
      <tr><td data-t="dayLen"></td><td id="len"></td></tr>
      <tr><td data-t="altAz"></td><td id="altaz"></td></tr>
    </table>
    <div id="bstat" class="muted" style="margin-top:8px"></div>
    <button id="netbtn" class="estrow netrow" type="button" aria-haspopup="dialog"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg><span id="nettxt"></span><u data-t="details"></u></button>
  </details>
</details></div>
