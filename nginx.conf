# Paylaşılan önbellek API'sine istek sınırı: gerçek ziyaretçi IP'si Cloudflare başlığından (tünel tüm trafiği tek IP'den getirir).
# IP yalnız bellekteki sayaçta tutulur. Erişim kaydı her yerde kapalı: varsayılan biçim X-Forwarded-For ile ziyaretçinin gerçek
# IP'sini yazıyordu ("IP saklanmaz" sözüyle çelişiyordu). Hata kaydında istemci adresi olmaz.
limit_req_zone $http_cf_connecting_ip zone=api:10m rate=60r/m;
limit_req_zone $http_cf_connecting_ip zone=fb:1m rate=6r/m;
# SunPeek — statik dosyalar + /api (sunpeek-api'ye vekil). Başlıklar server düzeyinde (location'da add_header olursa bunlar miras alınmaz).
server {
  listen 8080;
  server_tokens off;
  access_log off;
  root /usr/share/nginx/html;
  charset utf-8;
  index index.html;

  # CSP: betik yalnız kendi kökenimiz + unpkg (SRI'li) + Cloudflare Web Analytics; veri yalnız kullanılan servislere
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://ibasemaps-api.arcgis.com https://unpkg.com; connect-src 'self' https://overturemaps-extras-us-west-2.s3.amazonaws.com https://s3.amazonaws.com https://photon.komoot.io https://overpass-api.de https://maps.mail.ru https://overpass.private.coffee https://api.open-meteo.com https://archive-api.open-meteo.com https://nominatim.openstreetmap.org https://cloudflareinsights.com; base-uri 'none'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), screen-wake-lock=(self), camera=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control "no-cache" always;

  # sahada doğrulama cevabı: tek POST yolu, küçük gövde, ayrı ve düşük hız sınırı
  location = /api/feedback {
    limit_except POST { deny all; }
    client_max_body_size 2k;
    limit_req zone=fb burst=3 nodelay;
    limit_req_status 429;
    access_log off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://sunpeek-api:8081;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/ {
    limit_except GET { deny all; }
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    access_log off;
    resolver 127.0.0.11 valid=30s ipv6=off; # Docker DNS: api kapalıyken de nginx açılır, açılınca bulunur
    set $api http://sunpeek-api:8081;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    gzip on; gzip_types application/json; gzip_proxied any;
  }

  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ =404;
  }
}
