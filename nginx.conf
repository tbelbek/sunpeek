# SunPeek — yalnız statik dosyalar. Başlıklar server düzeyinde (location'da add_header olursa bunlar miras alınmaz).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  charset utf-8;
  index index.html;

  # CSP: betik yalnız kendi kökenimiz + unpkg (SRI'li) + Cloudflare Web Analytics; veri yalnız kullanılan servislere
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://unpkg.com; connect-src https://overpass-api.de https://maps.mail.ru https://overpass.private.coffee https://api.open-meteo.com https://nominatim.openstreetmap.org https://cloudflareinsights.com; base-uri 'none'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), screen-wake-lock=(self), camera=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control "no-cache" always;

  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ =404;
  }
}
